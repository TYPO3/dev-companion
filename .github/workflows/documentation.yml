name: Documentation

# Every push to main, rather than the paths that can change the site. The build
# is a minute and the deployment is idempotent, while a path filter is a second
# list of what the site is made of and goes stale silently.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a running one is finished rather than dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The newest line composer.json supports. This job builds the site rather
      # than testing what the package runs on, which is ci.yml's matrix, so the
      # lowest supported version buys nothing here.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # The theme's finish step is one bundled file and installs nothing, so
      # node is here for that alone.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # What this repository does to a render: the copy, with every link that
      # leaves the tree rewritten to the file on GitHub.
      - name: Prepare the source
        run: bin/cli documentation:prepare

      # The renderer is a build tool and this repository carries none of it —
      # D-DOC-028. It is required into a directory of its own, outside the
      # checkout, so nothing about it reaches this package's own dependencies.
      # The theme brings phpDocumentor Guides with it, and the finish step is
      # the one bundled file it ships.
      - name: Render the site
        env:
          RENDERER: ${{ runner.temp }}/renderer
        run: |
          mkdir -p "$RENDERER"
          composer init --working-dir="$RENDERER" --no-interaction --name=typo3/dev-companion-render
          composer require --working-dir="$RENDERER" --no-interaction --no-progress typo3/soul-guides-theme
          "$RENDERER"/vendor/bin/guides --no-progress -c documentation
          node "$RENDERER"/vendor/typo3/soul-guides-theme/resources/dist/soul-finish.js .site/html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .site/html

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
